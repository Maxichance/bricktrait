name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The LDraw libraries (official ~150 MB, parts in review ~90 MB) are kept
      # between runs, refreshed monthly
      - id: month
        run: echo "value=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            .ldraw
            .ldraw-unofficial
          key: ldraw-${{ steps.month.outputs.value }}

      - run: npm run parts

      # ~4,700 thumbnails take a few minutes to render: keep them while the
      # rendering code is unchanged, and save again when parts are added
      - uses: actions/cache@v6
        with:
          path: static/thumbs
          key: thumbs-${{ hashFiles('src/lib/scene.ts', 'src/lib/thumb-render.ts') }}-${{ hashFiles('static/ldraw/catalog.json') }}
          restore-keys: thumbs-${{ hashFiles('src/lib/scene.ts', 'src/lib/thumb-render.ts') }}-
      - run: npm run thumbs
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run e2e
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
